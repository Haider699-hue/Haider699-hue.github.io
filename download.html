<style>
:root{--void:#08070c;--accent:#8b7bff;--accent-2:#38e8ff;--ink:#f3f1fb;--ink-dim:#aaa7c2;--pop:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));font-family:'Cairo',sans-serif;background:var(--void);color:var(--ink);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(ellipse 70% 45% at 50% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),
  radial-gradient(circle at 90% 80%,color-mix(in srgb,var(--accent-2) 8%,transparent),transparent 45%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.avatar{position:relative;width:88px;height:88px}
.avatar::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),var(--accent-2),transparent 45%,var(--accent));animation:spin 7s linear infinite}
.avatar img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 38%;border:4px solid var(--void);background:#fff;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-stage{perspective:900px;width:min(300px,78vw)}
.logo3d{position:relative;transform-style:preserve-3d;font-size:0;transform:rotateX(-6deg) rotateY(14deg);animation:sway 7s ease-in-out infinite}
@keyframes sway{50%{transform:rotateX(-4deg) rotateY(-16deg)}}
.logo3d .ly{display:block;width:100%;height:auto;fill:#f6f3ff;transform:translateZ(calc(var(--d,0)*-1px))}
.logo3d .ly:not(.front){position:absolute;inset:0}
.logo3d .front{position:relative;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 60%,transparent))}
.logo3d .glow{fill:var(--accent);opacity:.55;filter:blur(8px)}
.card{width:100%;max-width:440px;margin-top:6px;padding:24px 20px 22px;text-align:center;background:#100014;border:2px solid #000;border-radius:3px;
  box-shadow:inset 0 0 0 2px #2b0b66,0 0 0 1px rgba(120,70,255,.4),0 10px 30px rgba(0,0,0,.6)}
h1{font-size:21px;font-weight:800;line-height:1.5}
.status{font-size:14.5px;color:var(--ink-dim);margin-top:4px}
.count{font-family:'Lalezar','Cairo',sans-serif;font-size:76px;line-height:1;margin:16px 0 14px;font-variant-numeric:tabular-nums;
  text-shadow:0 0 24px color-mix(in srgb,var(--accent) 70%,transparent)}
.bar{height:16px;margin:0 auto 4px;padding:2px;border:2px solid #fff;background:#0b0a11;box-shadow:0 0 0 2px #000}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--accent) 0 12px,transparent 12px 16px);transition:width 1s linear}
.btn{display:none;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;padding:14px 18px;position:relative;overflow:hidden;
  font:800 17px/1.4 'Cairo',sans-serif;color:#fff;text-decoration:none;border-radius:12px;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#000));
  box-shadow:0 4px 18px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 2px 0 rgba(255,255,255,.3);transition:transform .2s,filter .2s}
.btn.show{display:flex;animation:pop .55s var(--pop)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(120%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(-120%)}}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.back{font-size:13.5px;font-weight:700;color:var(--ink-dim);text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.25);padding-bottom:1px}
.back:hover{color:var(--accent-2)}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
