/* ZORK — نظام تصميم موحّد (المرحلة ٦). الترتيب = ترتيب الـcascade الأصلي. */
:root{
  /* tokens: ألوان/ثيمات (بتتبدل بـ html[data-th]) */
  --pop:cubic-bezier(.34, 1.56, .64, 1);
  --glass-highlight:rgba(255, 255, 255, 0.15);
  --emerald:#00ffaa;
  --emerald-glow:rgba(0, 255, 170, 0.5);
  --diamond:#00e5ff;
  --diamond-glow:rgba(0, 229, 255, 0.5);
  --gold:#ffaa00;
  --gold-glow:rgba(255, 170, 0, 0.5);
  --amethyst:#d900ff;
  --r-pill:50px;
  --blur:blur(16px);
  --void:#050308;
  --accent:#a855f7;
  --accent-2:#c084fc;
  --glass-border:rgba(255,255,255,.09);
  --ink:#f3f1fb;
  --ink-dim:#aaa7c2;
  --ink-faint:#8d8aa6;
  --r-md:18px;
  --xp:#c084fc;
  /* tokens ثابتة */
  --zk-black:#000;
  --zk-white:#fff;
  --zk-violet:#a855f7;
  --zk-cyan:#8b5cf6;
  --zk-violet-deep:#2b0b66;
  --zk-cyan-soft:#c084fc;
  --zk-pink:#d946ef;
  --zk-night:#0c0618;
  --zk-night-deep:#030206;
  --zk-coral:#ff6b6b;
  --zk-dur:.3s;
}
*, *::before, *::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.cats::-webkit-scrollbar{display:none}
.empty-state, .more-wrap{display:flex;justify-content:center;align-items:center;flex-direction:column}
.empty-state[hidden], .more-wrap[hidden], .sheet-overlay[hidden]{display:none !important}
svg[style*="position:absolute"]{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
body{color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none}
header{position:sticky;top:12px;z-index:100;width:calc(100% - 24px);max-width:1400px;margin:0 auto;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-top:1px solid var(--glass-highlight);transition:transform var(--zk-dur) ease}

.hdr-btn:hover{color:var(--accent);background:rgba(139,92,246,0.1)}

.panel{max-width:1400px;margin:20px auto 40px;background:transparent;border:none;box-shadow:none;position:relative;z-index:10}
.hero{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-blocks{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:15px;width:100%;max-width:600px;position:relative;z-index:2}

.hb .pix{width:30px;height:30px;color:var(--bc);filter:drop-shadow(0 0 10px var(--bc))}
.hb:hover{transform:translateY(-8px) scale(1.05);background:rgba(20, 10, 40, 0.8);border-color:var(--bc);box-shadow:0 15px 25px rgba(0,0,0,0.4), 0 0 20px color-mix(in srgb, var(--bc) 30%, transparent)}
.ground{display:none}
.cl{display:none !important}
.search-zone{padding:20px;margin-top:10px}
.search-box{max-width:600px;margin:0 auto;position:relative;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);padding:5px;display:flex;align-items:center;transition:all var(--zk-dur) ease}
.search-box svg{width:20px;height:20px;color:var(--ink-dim);margin-inline-start:15px}
#searchInput{flex:1;background:transparent;border:none;color:var(--ink);padding:12px 15px;font-size:16px;font-family:'Cairo', sans-serif}
#searchInput:focus{outline:none}
#searchInput::placeholder{color:var(--ink-faint)}
.result-count{text-align:center;margin-top:10px;color:var(--ink-dim);font-size:13px;min-height:20px}
.cats.chipbar{position:sticky;top:80px;z-index:90;padding:15px 20px;margin-bottom:20px}
.cchips{display:flex;justify-content:center;gap:12px;overflow-x:auto;padding-bottom:5px}
.cchip{backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--r-pill);padding:8px 20px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-dim);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.2);transition:all var(--zk-dur) ease;position:relative;overflow:hidden}

.cchip[data-cat="All"]{--cc:#fff}
.cchip[data-cat="Addons"]{--cc:var(--emerald)}
.cchip[data-cat="Versions"]{--cc:var(--diamond)}
.cchip[data-cat="Skins"]{--cc:var(--gold)}
.cchip[data-cat="Shaders"]{--cc:var(--amethyst)}
.cchip:hover{border-color:var(--cc);color:var(--zk-white);transform:translateY(-2px);box-shadow:0 5px 15px color-mix(in srgb, var(--cc) 20%, transparent)}
.cchip.active{background:var(--cc);color:var(--zk-black);border-color:var(--cc);box-shadow:0 0 20px color-mix(in srgb, var(--cc) 60%, transparent)}
.cchip.active .pix{color:var(--zk-black)}
.main{padding:0 20px 40px;max-width:1400px;margin:0 auto}
#modList{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:24px}
.mod-card{position:relative;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-top:1px solid var(--glass-highlight);border-left:1px solid var(--glass-highlight);padding:0;display:flex;flex-direction:column;transform-style:preserve-3d;overflow:visible}
.mod-card::before{display:none}
.mod-card:hover{border-color:color-mix(in srgb, var(--cat-color) 50%, rgba(255,255,255,0.2))}
.mod-thumb{width:100%;aspect-ratio:16/9;position:relative;border-radius:var(--r-md) var(--r-md) 0 0;overflow:hidden;background:rgba(0,0,0,0.5)}
.mod-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s ease}
.mod-card:hover .mod-thumb img{transform:scale(1.1)}
.k-skin .mod-thumb{aspect-ratio:1/1}
.k-skin .mod-thumb img{object-fit:contain}
.mod-badge{position:absolute;top:12px;left:12px;z-index:2;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);border:1px solid var(--cat-color);color:var(--cat-color);padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;box-shadow:0 0 10px color-mix(in srgb, var(--cat-color) 40%, transparent)}
.mod-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.mod-name{font-size:16px;font-weight:800;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-shadow:0 2px 4px rgba(0,0,0,0.8)}
.mod-spec{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
.mod-spec .dot{color:var(--ink-faint)}
.dl-btn{margin-top:auto;background:linear-gradient(135deg, var(--cat-color), color-mix(in srgb, var(--cat-color) 50%, var(--zk-black)));color:var(--zk-white) !important;text-shadow:0 1px 2px rgba(0,0,0,0.5);border:none;padding:12px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.dl-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);transform:translateX(-100%);transition:0.5s}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb, var(--cat-color) 60%, transparent);filter:brightness(1.1)}
.dl-btn:hover::before{transform:translateX(100%)}
.view-btn{width:100%;cursor:pointer;font-family:inherit}
.dl-btn.is-off{background:rgba(255,255,255,0.05);color:var(--ink-faint) !important;box-shadow:none;border:1px solid var(--glass-border)}
.dl-btn.is-off::before{display:none}
.k-ver{grid-column:1 / -1;flex-direction:row;align-items:center;padding:10px}
.k-ver .mod-body{flex-direction:row;align-items:center;justify-content:space-between;padding:0 10px}
.k-ver .mod-name{font-size:20px;color:var(--diamond);text-shadow:0 0 10px var(--diamond-glow);flex:1}
.k-ver .dl-btn{margin:0;min-width:120px}
@media (max-width: 768px){
  .k-ver{flex-direction:column;align-items:stretch}

}
.sheet-overlay{background:rgba(0, 0, 0, 0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-bottom:none;border-radius:30px 30px 0 0}

.more-btn{background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);color:var(--zk-white);border-radius:var(--r-pill);padding:12px 30px;backdrop-filter:blur(10px);transition:var(--zk-dur)}

html[data-th=nether]{--void:#0b0302;--diamond:#ff7a3a;--diamond-glow:rgba(255,122,58,.5);--amethyst:#ff3d2e}

body::before{background:radial-gradient(circle at 15% 20%,color-mix(in srgb,var(--accent,var(--zk-violet)) 15%,transparent),transparent 40%),radial-gradient(circle at 85% 60%,color-mix(in srgb,var(--accent-2,var(--zk-cyan-soft)) 13%,transparent),transparent 40%),radial-gradient(circle at 50% 90%,color-mix(in srgb,var(--accent,var(--zk-violet)) 9%,transparent),transparent 50%)}

/* ZORK fix: show full thumbnail (no crop) over a blurred copy of itself */
.mod-card:not(.k-ver):not(.k-skin) .mod-thumb{background:#050308}
.mod-card:not(.k-ver):not(.k-skin) .mod-thumb::before{content:"";position:absolute;inset:-12px;z-index:0;background:var(--bg) center/cover no-repeat;filter:blur(16px) brightness(.5) saturate(1.2)}
.mod-card:not(.k-ver):not(.k-skin) .mod-thumb img{object-fit:contain;z-index:1}
.mod-card:not(.k-ver):not(.k-skin):hover .mod-thumb img{transform:scale(1.04)}

/* ZORK fix 2: vertical cards - image on top at full width (16:9), info below */
.mod-card:not(.k-ver){grid-column:auto;flex-direction:column}
.mod-card:not(.k-ver) .mod-thumb{flex:none;width:100%;aspect-ratio:16/9;min-height:0;border-radius:6px 6px 0 0}
.mod-card:not(.k-ver) .mod-body{justify-content:flex-start;padding:14px;gap:10px}
.mod-card:not(.k-ver) .mod-name{font-size:clamp(18px,5vw,22px)}
.k-skin .mod-thumb img{padding:8px 8px 22px}
@media(max-width:768px){
  .mod-card:not(.k-ver){grid-column:1/-1}
  .mod-card:not(.k-ver) .mod-thumb{min-height:0}
  .mod-card:not(.k-ver) .mod-body{padding:12px;gap:9px}
}

/* ZORK fix 3: card border drawn above the thumbnail so the color wraps the whole card */
.mod-card:not(.k-ver)::after{content:"";position:absolute;inset:0;z-index:6;border-radius:8px;pointer-events:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 38%,#2b2547)}
.mod-card.is-top:not(.k-ver)::after,.mod-card.is-new:not(.k-ver)::after{box-shadow:inset 0 0 0 2px var(--rc)}

/* ZORK fix 4: skins show the full image like other cards; versions with image use the image card */
.mod-card.k-skin .mod-thumb{background:#050308}
.mod-card.k-skin .mod-thumb img{padding:0;filter:none;object-fit:contain}
.mod-card.k-skin.vis .mod-thumb img,.mod-card.k-skin:hover .mod-thumb img{animation:none;transform:none}
.mod-card.k-skin:hover .mod-thumb img{transform:scale(1.04)}
.mod-card .zped{display:none}
.mod-card.k-skin .mod-thumb::before{content:"";position:absolute;inset:-12px;z-index:0;background:var(--bg) center/cover no-repeat;filter:blur(16px) brightness(.5) saturate(1.2)}
.mod-card.k-skin .mod-thumb img{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.mod-card.k-vimg .mod-name{color:var(--diamond)}

/* ===== ZORK · صفحة تفاصيل المود (بملء الشاشة) ===== */
.sheet-overlay{position:fixed;inset:0;z-index:400;overflow-y:auto;overscroll-behavior:contain;background:var(--void);backdrop-filter:none;-webkit-backdrop-filter:none}
