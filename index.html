/* HAIDER — نظام تصميم موحّد (المرحلة ٦). الترتيب = ترتيب الـcascade الأصلي. */
:root{
  /* tokens: ألوان/ثيمات (بتتبدل بـ html[data-th]) */
  --pop:cubic-bezier(.34, 1.56, .64, 1);
  --glass-highlight:rgba(255, 255, 255, 0.15);
  --emerald:#00ffaa;
  --emerald-glow:rgba(0, 255, 170, 0.5);
  --diamond:#00e5ff;
  --diamond-glow:rgba(0, 229, 255, 0.5);
  --gold:#ffaa00;
  --gold-glow:rgba(255, 170, 0, 0.5);
  --amethyst:#d900ff;
  --r-pill:50px;
  --blur:blur(16px);
  --void:#050308;
  --accent:#a855f7;
  --accent-2:#c084fc;
  --glass-border:rgba(255,255,255,.09);
  --ink:#f3f1fb;
  --ink-dim:#aaa7c2;
  --ink-faint:#8d8aa6;
  --r-md:18px;
  --xp:#c084fc;
  /* tokens ثابتة */
  --zk-black:#000;
  --zk-white:#fff;
  --zk-violet:#a855f7;
  --zk-cyan:#8b5cf6;
  --zk-violet-deep:#2b0b66;
  --zk-cyan-soft:#c084fc;
  --zk-pink:#d946ef;
  --zk-night:#0c0618;
  --zk-night-deep:#030206;
  --zk-coral:#ff6b6b;
  --zk-dur:.3s;
}
*, *::before, *::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.cats::-webkit-scrollbar{display:none}
.empty-state, .more-wrap{display:flex;justify-content:center;align-items:center;flex-direction:column}
.empty-state[hidden], .more-wrap[hidden], .sheet-overlay[hidden]{display:none !important}
svg[style*="position:absolute"]{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
body{color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none}
header{position:sticky;top:12px;z-index:100;width:calc(100% - 24px);max-width:1400px;margin:0 auto;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-top:1px solid var(--glass-highlight);transition:transform var(--zk-dur) ease}
.header-inner{padding:10px 20px;display:flex;align-items:center;gap:15px}

.hdr-btn{background:transparent;border:none;color:var(--ink-dim);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.2s}
.hdr-btn:hover{color:var(--accent);background:rgba(139,92,246,0.1)}
#muteBtn{margin-inline-start:auto}
.ore-strip{position:absolute;bottom:-1px;left:5%;width:90%;height:2px;animation:neon-flow 4s linear infinite;opacity:0.8}
@keyframes neon-flow{0% { background-position: 100% 0; } 100% { background-position: -100% 0; }}
.panel{max-width:1400px;margin:20px auto 40px;background:transparent;border:none;box-shadow:none;position:relative;z-index:10}
.hero{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-blocks{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:15px;width:100%;max-width:600px;position:relative;z-index:2}
.hb{flex:1 1 calc(25% - 15px);min-width:90px;min-height:80px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer;transition:all var(--zk-dur) cubic-bezier(0.175, 0.885, 0.32, 1.275)}
.hb .pix{width:30px;height:30px;color:var(--bc);filter:drop-shadow(0 0 10px var(--bc))}
.hb:hover{transform:translateY(-8px) scale(1.05);background:rgba(20, 10, 40, 0.8);border-color:var(--bc);box-shadow:0 15px 25px rgba(0,0,0,0.4), 0 0 20px color-mix(in srgb, var(--bc) 30%, transparent)}
.ground{display:none}
.cl{display:none !important}
.search-zone{padding:20px;margin-top:10px}
.search-box{max-width:600px;margin:0 auto;position:relative;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);padding:5px;display:flex;align-items:center;transition:all var(--zk-dur) ease}
.search-box svg{width:20px;height:20px;color:var(--ink-dim);margin-inline-start:15px}
#searchInput{flex:1;background:transparent;border:none;color:var(--ink);padding:12px 15px;font-size:16px;font-family:'Cairo', sans-serif}
#searchInput:focus{outline:none}
#searchInput::placeholder{color:var(--ink-faint)}
.result-count{text-align:center;margin-top:10px;color:var(--ink-dim);font-size:13px;min-height:20px}
.cats.chipbar{position:sticky;top:80px;z-index:90;padding:15px 20px;margin-bottom:20px}
.cchips{display:flex;justify-content:center;gap:12px;overflow-x:auto;padding-bottom:5px}
.cchip{backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--r-pill);padding:8px 20px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-dim);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.2);transition:all var(--zk-dur) ease;position:relative;overflow:hidden}
.cchip .pix{width:20px;height:20px}
.cchip[data-cat="All"]{--cc:#fff}
.cchip[data-cat="Addons"]{--cc:var(--emerald)}
.cchip[data-cat="Versions"]{--cc:var(--diamond)}
.cchip[data-cat="Skins"]{--cc:var(--gold)}
.cchip[data-cat="Shaders"]{--cc:var(--amethyst)}
.cchip:hover{border-color:var(--cc);color:var(--zk-white);transform:translateY(-2px);box-shadow:0 5px 15px color-mix(in srgb, var(--cc) 20%, transparent)}
.cchip.active{background:var(--cc);color:var(--zk-black);border-color:var(--cc);box-shadow:0 0 20px color-mix(in srgb, var(--cc) 60%, transparent)}
.cchip.active .pix{color:var(--zk-black)}
.main{padding:0 20px 40px;max-width:1400px;margin:0 auto}
#modList{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:24px}
.mod-card{position:relative;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-top:1px solid var(--glass-highlight);border-left:1px solid var(--glass-highlight);padding:0;display:flex;flex-direction:column;transform-style:preserve-3d;overflow:visible}
.mod-card::before{display:none}
.mod-card:hover{border-color:color-mix(in srgb, var(--cat-color) 50%, rgba(255,255,255,0.2))}
.mod-thumb{width:100%;aspect-ratio:16/9;position:relative;border-radius:var(--r-md) var(--r-md) 0 0;overflow:hidden;background:rgba(0,0,0,0.5)}
.mod-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s ease}
.mod-card:hover .mod-thumb img{transform:scale(1.1)}
.k-skin .mod-thumb{aspect-ratio:1/1}
.k-skin .mod-thumb img{object-fit:contain}
.mod-badge{position:absolute;top:12px;left:12px;z-index:2;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);border:1px solid var(--cat-color);color:var(--cat-color);padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800;box-shadow:0 0 10px color-mix(in srgb, var(--cat-color) 40%, transparent)}
.mod-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.mod-name{font-size:16px;font-weight:800;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-shadow:0 2px 4px rgba(0,0,0,0.8)}
.mod-spec{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
.mod-spec .dot{color:var(--ink-faint)}
.dl-btn{margin-top:auto;background:linear-gradient(135deg, var(--cat-color), color-mix(in srgb, var(--cat-color) 50%, var(--zk-black)));color:var(--zk-white) !important;text-shadow:0 1px 2px rgba(0,0,0,0.5);border:none;padding:12px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.dl-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);transform:translateX(-100%);transition:0.5s}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb, var(--cat-color) 60%, transparent);filter:brightness(1.1)}
.dl-btn:hover::before{transform:translateX(100%)}
.view-btn{width:100%;cursor:pointer;font-family:inherit}
.dl-btn.is-off{background:rgba(255,255,255,0.05);color:var(--ink-faint) !important;box-shadow:none;border:1px solid var(--glass-border)}
.dl-btn.is-off::before{display:none}
.k-ver{grid-column:1 / -1;flex-direction:row;align-items:center;padding:10px}
.k-ver .mod-body{flex-direction:row;align-items:center;justify-content:space-between;padding:0 10px}
.k-ver .mod-name{font-size:20px;color:var(--diamond);text-shadow:0 0 10px var(--diamond-glow);flex:1}
.k-ver .dl-btn{margin:0;min-width:120px}
@media (max-width: 768px){
  .k-ver{flex-direction:column;align-items:stretch}
  .k-ver .mod-body{flex-direction:column;align-items:stretch;gap:10px}
}
.sheet-overlay{background:rgba(0, 0, 0, 0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-bottom:none;border-radius:30px 30px 0 0}

.how, .rel{background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);color:var(--ink);border-radius:12px;transition:var(--zk-dur)}

.modal h3{background:transparent;border-bottom:1px solid var(--glass-border);color:var(--zk-white)}

.modal input:focus, .modal select:focus{border-color:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 50%,transparent)}
.more-btn{background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);color:var(--zk-white);border-radius:var(--r-pill);padding:12px 30px;backdrop-filter:blur(10px);transition:var(--zk-dur)}

#toTop{background:rgba(139,92,246,0.1);border:1px solid var(--accent);border-radius:50%}

}

html[data-th=nether]{--void:#0b0302;--diamond:#ff7a3a;--diamond-glow:rgba(255,122,58,.5);--amethyst:#ff3d2e}

body::before{background:radial-gradient(circle at 15% 20%,color-mix(in srgb,var(--accent,var(--zk-violet)) 15%,transparent),transparent 40%),radial-gradient(circle at 85% 60%,color-mix(in srgb,var(--accent-2,var(--zk-cyan-soft)) 13%,transparent),transparent 40%),radial-gradient(circle at 50% 90%,color-mix(in srgb,var(--accent,var(--zk-violet)) 9%,transparent),transparent 50%)}

/* HAIDER fix: show full thumbnail (no crop) over a blurred copy of itself */
.mod-card:not(.k-ver):not(.k-skin) .mod-thumb{background:#050308}
.mod-card:not(.k-ver):not(.k-skin) .mod-thumb::before{content:"";position:absolute;inset:-12px;z-index:0;background:var(--bg) center/cover no-repeat;filter:blur(16px) brightness(.5) saturate(1.2)}
.mod-card:not(.k-ver):not(.k-skin) .mod-thumb img{object-fit:contain;z-index:1}
.mod-card:not(.k-ver):not(.k-skin):hover .mod-thumb img{transform:scale(1.04)}

/* HAIDER fix 2: vertical cards - image on top at full width (16:9), info below */
.mod-card:not(.k-ver){grid-column:auto;flex-direction:column}
.mod-card:not(.k-ver) .mod-thumb{flex:none;width:100%;aspect-ratio:16/9;min-height:0;border-radius:6px 6px 0 0}
.mod-card:not(.k-ver) .mod-body{justify-content:flex-start;padding:14px;gap:10px}
.mod-card:not(.k-ver) .mod-name{font-size:clamp(18px,5vw,22px)}
.k-skin .mod-thumb img{padding:8px 8px 22px}
@media(max-width:768px){
  .mod-card:not(.k-ver){grid-column:1/-1}
  .mod-card:not(.k-ver) .mod-thumb{min-height:0}
  .mod-card:not(.k-ver) .mod-body{padding:12px;gap:9px}
}

/* HAIDER fix 3: card border drawn above the thumbnail so the color wraps the whole card */
.mod-card:not(.k-ver)::after{content:"";position:absolute;inset:0;z-index:6;border-radius:8px;pointer-events:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 38%,#2b2547)}
.mod-card.is-top:not(.k-ver)::after,.mod-card.is-new:not(.k-ver)::after{box-shadow:inset 0 0 0 2px var(--rc)}

/* HAIDER fix 4: skins show the full image like other cards; versions with image use the image card */
.mod-card.k-skin .mod-thumb{background:#050308}
.mod-card.k-skin .mod-thumb img{padding:0;filter:none;object-fit:contain}
.mod-card.k-skin.vis .mod-thumb img,.mod-card.k-skin:hover .mod-thumb img{animation:none;transform:none}
.mod-card.k-skin:hover .mod-thumb img{transform:scale(1.04)}
.mod-card .zped{display:none}
.mod-card.k-skin .mod-thumb::before{content:"";position:absolute;inset:-12px;z-index:0;background:var(--bg) center/cover no-repeat;filter:blur(16px) brightness(.5) saturate(1.2)}
.mod-card.k-skin .mod-thumb img{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.mod-card.k-vimg .mod-name{color:var(--diamond)}
.sheet-overlay{--surface:#16141e;--line:rgba(255,255,255,.08)}
@keyframes zfade{from{opacity:0;transform:translateY(8px)}}
/* ===== HAIDER · صفحة تفاصيل المود (بملء الشاشة) ===== */
.sheet-overlay{position:fixed;inset:0;z-index:400;overflow-y:auto;overscroll-behavior:contain;background:var(--void);backdrop-filter:none;-webkit-backdrop-filter:none}

<script>
  /* HAIDER core logic — preserve database, search, and core functionality */
  /* ===== أضف عناصرك هنا ===== */
  const LOCAL_MODS = [
    /* انسخ القالب ده وكرره لكل عنصر (حط فاصلة بين كل عنصر والتاني):
    {
      name: 'اسم العنصر',
      category: 'Addons',          // Addons | Shaders | Skins | Versions
      download: 'https://www.mediafire.com/...',
      image: 'https://...صورة.jpg',   // اختياري
      description: 'وصف قصير',        // اختياري
      mcVersion: '1.21',              // اختياري
      size: '25 MB',                  // اختياري
      featured: false                 // true = علامة "مميز"
    },
    */
  ];
  /* ========================== */
  let allMods = LOCAL_MODS.slice();
  const PAGE_SIZE = 24, SEARCH_DEBOUNCE_MS = 200, EAGER_CARDS = 4;
  let sb = window.haiderSupabase;
  const REPORT_URL = '';
  const PAGES = '';   /* بعد ما ترفع صفحات build-pages.mjs اكتب هنا '/m/' عشان روابط المشاركة تبقى صفحات ثابتة */   
  const DL_NOTE = 'سيتم تحويلك لصفحة التحميل بأمان';   
  const NO_LINK_MSG = 'الرابط غير متاح حاليًا';
  const CAT = {
    Addons:   { label: 'مودات',             c: 'var(--emerald)',  ink: '#000',  st: 'transparent',  icon: 'i-addons',   route: 'addons' },
    Versions: { label: 'إصدارات ماينكرافت', c: 'var(--diamond)',  ink: '#000',  st: 'transparent',  icon: 'i-versions', route: 'versions' },
    Skins:    { label: 'السكنات',           c: 'var(--gold)',     ink: '#000',  st: 'transparent',  icon: 'i-skins',    route: 'skins' },
    Shaders:  { label: 'الشادرات',          c: 'var(--amethyst)', ink: '#000', st: 'transparent', icon: 'i-shaders',  route: 'shaders' }
  };
  const ROUTE_CAT = { all: 'All', addons: 'Addons', versions: 'Versions', skins: 'Skins', shaders: 'Shaders' };
  const CAP_AR = { All: 'الكل', Addons: 'مودات', Versions: 'إصدارات', Skins: 'سكنات', Shaders: 'شادرات' };
  const TYPES = ['mcpack', 'mcaddon', 'mcworld', 'apk', 'other'];

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function safeUrl(u) { try { u = String(u == null ? '' : u).trim(); const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : ''; } catch (e) { return ''; } }
  const cssUrl = u => String(u || '').replace(/\\/g, '%5C').replace(/'/g, '%27').replace(/"/g, '%22').replace(/[()\s]/g, c => encodeURIComponent(c));
  const fold = s => String(s == null ? '' : s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  function h32(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function mkSlug(n,i){const b=String(n).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'').slice(0,40).replace(/-+$/,'');return (b||'item')+'-'+String(i).replace(/[^a-z0-9]/gi,'').slice(0,8).toLowerCase()}
  function normalize(m) {
    if (m && m._n) return m._n;
    const src = (m && typeof m === 'object') ? m : {};
    const str = v => v == null ? '' : String(v).trim();
    const list = v => Array.isArray(v) ? v : [];
    const name = str(src.name) || 'بدون اسم', download = safeUrl(src.download);
    const dl = (src.downloads === '' || src.downloads == null || !isFinite(+src.downloads)) ? null : +src.downloads;
    const slug = name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    const n = {
      id: str(src.id) || (slug + '-' + h32(name + '|' + download)),
      name, category: str(src.category), image: safeUrl(src.image), download,
      description: str(src.description), mcVersion: str(src.mcVersion), size: str(src.size), downloads: dl,
      createdAt: isFinite(Date.parse(src.createdAt)) ? str(src.createdAt) : '',
      images: list(src.images).map(safeUrl).filter(Boolean), tags: list(src.tags).map(str).filter(Boolean),
      featured: src.featured === true || src.featured === 'true', type: TYPES.indexOf(src.type) > -1 ? src.type : '', slug: str(src.slug) || mkSlug(name, str(src.id) || h32(name + '|' + download))
    };
    n.s = fold(n.name + ' ' + n.tags.join(' ') + ' ' + n.description);
    try { Object.defineProperty(src, '_n', { value: n, enumerable: false }); } catch (e) {}
    return n;
  }

  let detailOpen = false, curId = '', pushed = false, openHash = '', openerEl = null, view = [], shown = 0, curCat = 'All', curQ = '', curSort = '';
  const $id = id => document.getElementById(id);
  function filtered() {
    const q = fold(curQ).trim();
    const r = allMods.filter(m => { const n = normalize(m); return (curCat === 'All' || n.category === curCat) && (!q || n.s.indexOf(q) > -1); });
    const t = m => Date.parse(normalize(m).createdAt) || 0;
    if (curSort === 'new') r.sort((a, b) => t(b) - t(a));
    else if (curSort === 'old') r.sort((a, b) => t(a) - t(b));
    else if (curSort === 'name') r.sort((a, b) => normalize(a).name.localeCompare(normalize(b).name, 'ar'));
    else if (curSort === 'downloads') r.sort((a, b) => (normalize(b).downloads || 0) - (normalize(a).downloads || 0));
    return r;
  }
  function apply() { renderMods(filtered()); }

  const KIND = { Addons: 'k-addon', Skins: 'k-skin', Shaders: 'k-shader', Versions: 'k-ver' };
  const chip = v => v ? `<span class="num">${esc(v)}</span>` : '';
  function cardHtml(m, i) {
    const n = normalize(m), c = CAT[n.category] || { label: n.category, c: '#fff', ink: '#000', st: 'transparent', icon: 'i-all' };
    const kind0 = KIND[n.category] || 'k-addon', kind = (kind0 === 'k-ver' && n.image) ? 'k-vimg' : kind0, sq = kind === 'k-skin';
    const thumb = n.image
      ? `<img src="${esc(n.image)}" alt="" width="${sq ? 320 : 320}" height="${sq ? 320 : 180}" decoding="async" loading="${i < EAGER_CARDS ? 'eager' : 'lazy'}">`
      : `<div class="ph" aria-hidden="true" style="--ph-c:${c.c}; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05);"><svg viewBox="0 0 16 16" style="width:40px;height:40px;color:${c.c};"><use href="#${c.icon}"/></svg></div>`;
    const btn = '<button type="button" class="dl-btn view-btn">عرض التفاصيل</button>';
    const specs = [n.type && n.type !== 'other' ? '.' + n.type : '', n.size, kind === 'k-ver' ? '' : n.mcVersion].filter(Boolean);
    const chips = specs.map(v => `<span dir="ltr">${esc(v)}</span>`).join('<span class="dot" aria-hidden="true">·</span>');
    const name = `<div class="mod-name" role="button" tabindex="0">${esc(n.name)}</div>`;
    const wrap = chips ? `<div class="mod-spec">${chips}</div>` : '';
    const isNew = n.createdAt && (Date.now() - Date.parse(n.createdAt) < 6048e5),
      zb = n.featured ? '<div class="zbadges"><span class="zb zb-top">مميز</span></div>' : '';
    const head = `<div class="mod-card ${kind}${n.featured ? ' is-top' : ''}${isNew ? ' is-new' : ''}" data-id="${esc(n.id)}" data-cat="${esc(n.category)}" style="--cat-color:${c.c};">`;
    if (kind === 'k-ver') return `${head}<div class="mod-body">${name}${wrap}${btn}</div></div>`;
    const catl = `<div class="mod-cat"><svg class="pix" viewBox="0 0 16 16" aria-hidden="true"><use href="#${c.icon}"/></svg><span>${esc(c.label)}</span></div>`;
    const desc = n.description ? `<p class="mod-desc">${esc(n.description)}</p>` : '';
    return `${head}<div class="mod-thumb"${n.image?` style="--bg:url('${esc(cssUrl(n.image))}')"`:''}>${zb}${thumb}</div><div class="mod-body">${catl}${name}${desc}${wrap}${btn}</div></div>`;
  }

  function renderMods(mods) {
    if (mods === allMods) mods = filtered();
    view = mods || []; shown = 0;
    const seen = {};
    view.forEach(m => { const n = normalize(m); if (seen[n.id]) n.id += '-' + (++seen[n.id]); else seen[n.id] = 1; });
    const list = $id('modList');
    list.innerHTML = '';
    if (curCat === 'All' && !curId) {
      const order = ['Addons', 'Skins', 'Shaders', 'Versions'];
      const categories = [...order, ...new Set(view.map(m => normalize(m).category).filter(cat => cat && !order.includes(cat)))];
      const groups = categories.map(cat => ({ cat, items: view.filter(m => normalize(m).category === cat) })).filter(g => g.items.length);
      list.classList.add('grouped-categories');
      list.innerHTML = groups.map(g => {
        const meta = CAT[g.cat] || { label: g.cat, c: '#a855f7', icon: 'i-all' };
        return `<section class="category-section" style="--section-color:${meta.c}"><h2 class="category-heading"><span class="category-heading-icon"><svg class="pix" viewBox="0 0 16 16" aria-hidden="true"><use href="#${meta.icon}"/></svg></span><span>${esc(meta.label)}</span><span class="category-count">${g.items.length}</span></h2><div class="category-grid">${g.items.map((m, i) => cardHtml(m, i)).join('')}</div></section>`;
      }).join('');
      shown = view.length;
      $id('moreWrap').hidden = true;
    } else {
      list.classList.remove('grouped-categories');
      showMore(false);
    }
    $id('resultCount').textContent = view.length > 0 ? `تم العثور على ${view.length} عنصر` : '';
    $id('emptyState').hidden = view.length > 0;
    { const et = document.querySelector('#emptyState .empty-title'), es = document.querySelector('#emptyState .empty-sub'); if (et) et.textContent = window.__loadErr ? 'تعذّر تحميل المحتوى' : 'لا توجد نتائج في هذا البُعد'; if (es) es.textContent = window.__loadErr ? 'تحقق من الاتصال بالإنترنت ثم أعد تحميل الصفحة.' : 'جرّب كلمة بحث مختلفة أو اختر تصنيفًا آخر'; }
    if (curId && !detailOpen) fromHash(true);
  }
  function showMore(focusNew) {
    const part = view.slice(shown, shown + PAGE_SIZE), first = shown;
    $id('modList').insertAdjacentHTML('beforeend', part.map((m, k) => cardHtml(m, first + k)).join(''));
    shown += part.length;
    const left = view.length - shown;
    $id('moreWrap').hidden = left <= 0;
    $id('moreBtn').textContent = left > 0 ? `المزيد من العناصر (${left})` : 'المزيد من العناصر';
  }
  $id('moreBtn').addEventListener('click', () => showMore(true));

  function parseHash() {
    const h = location.hash.replace(/^#\/?/, ''), qi = h.indexOf('?');
    const parts = (qi < 0 ? h : h.slice(0, qi)).split('/'), sp = new URLSearchParams(qi < 0 ? '' : h.slice(qi + 1));
    const r = { cat: 'All', q: sp.get('q') || '', sort: sp.get('sort') || '', id: '' };
    if (parts[0] === 'c' && ROUTE_CAT[parts[1]]) r.cat = ROUTE_CAT[parts[1]];
    else if (parts[0] === 'i' && parts[1]) { try { r.id = decodeURIComponent(parts[1]); } catch (e) {} }
    return r;
  }
  function buildHash() {
    if (curCat === 'All' && !curQ && !curSort) return '#/';
    const p = [curQ ? 'q=' + encodeURIComponent(curQ) : '', curSort ? 'sort=' + encodeURIComponent(curSort) : ''].filter(Boolean).join('&');
    return '#/c/' + (curCat === 'All' ? 'all' : CAT[curCat].route) + (p ? '?' + p : '');
  }
  function go(push) {
    try { const h = buildHash(); if (location.hash !== h && !(h === '#/' && !location.hash)) history[push ? 'pushState' : 'replaceState'](null, '', h); } catch (e) {}
  }
  function syncUi() {
    document.querySelectorAll('.cchip').forEach(p => {
      const on = p.dataset.cat === curCat; p.classList.toggle('active', on); p.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    document.querySelectorAll('.hnav a').forEach(a => a.classList.toggle('active', a.dataset.nav === curCat));
    const inp = $id('searchInput'); if (inp && inp.value !== curQ) inp.value = curQ;
    const ss = $id('sortSel'); if (ss && ss.value !== curSort) ss.value = curSort;
  }
  function fromHash(force) {
    const r = parseHash();
    if (r.id) { if (detailOpen && location.hash === openHash) return; curId = r.id; if (!openDetail(r.id, 'route') && allMods.length) { curId = ''; try { history.replaceState(null, '', '#/'); } catch (e) {} } return; }
    if (detailOpen) closeUi();
    curId = '';
    if (r.cat === curCat && r.q === curQ && r.sort === curSort) return;
    curCat = r.cat; curQ = r.q; curSort = r.sort; syncUi(); apply();
  }
  addEventListener('popstate', fromHash); addEventListener('hashchange', fromHash);

  window.filterMods = function(cat, el) { curCat = cat; syncUi(); apply(); go(true); };
  let searchTimer = 0;
  function searchMods() { clearTimeout(searchTimer); curQ = $id('searchInput').value; apply(); go(false); }
  $id('sortSel').addEventListener('change', e => { curSort = e.target.value; apply(); go(false); });
  $id('searchInput').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(searchMods, SEARCH_DEBOUNCE_MS); });

  const HOW = {
    mcpack:  ['افتح الملف باستخدام لعبة ماينكرافت.', 'انتظر رسالة تأكيد الاستيراد.', 'افتح إعدادات العالم وفعّل الحزمة.', 'العب!'],
    mcaddon: ['افتح الملف باستخدام اللعبة.', 'انتظر الاستيراد.', 'فعّل الحزم من إعدادات العالم.'],
    mcworld: ['افتح الملف باللعبة.', 'ستجد العالم مضافاً لقائمتك.'],
    skin:    ['اختر السكن من إعدادات الشخصية بعد فتحه.'],
    shader:  ['فعّل الحزمة من الموارد، قد تتطلب جهازاً قوياً.'],
    version: ['ثبت التطبيق ووافق على التثبيت الخارجي.']
  };
  const howKey = n => HOW[n.type] ? n.type : n.type === 'apk' ? 'version' : ({ Skins: 'skin', Shaders: 'shader', Versions: 'version' }[n.category] || 'mcpack');
  const sheet = $id('sheetPanel'), sheetBody = $id('detailBody');
  const shareUrl = id => { try { const m = allMods.find(x => normalize(x).id === id), n = m && normalize(m);
    if (PAGES && n && n.slug) return location.origin + PAGES + encodeURIComponent(n.slug) + '.html';
    return location.href.split('#')[0] + '#/i/' + encodeURIComponent((n && n.slug) || id); } catch (e) { return ''; } };
  
  function detailHtml(n) {
    const c = CAT[n.category] || { label: n.category, c: '#fff', icon: 'i-all' };
    const imgs = Array.from(new Set([n.image].concat(n.images).filter(Boolean)));
    const fact = (k, v) => v ? `<div><dt>${k}</dt><dd dir="ltr">${esc(v)}</dd></div>` : '';
    const facts = fact('إصدار اللعبة المسجل', n.mcVersion) + fact('الحجم', n.size) + fact('التحميلات', n.downloads > 0 ? n.downloads.toLocaleString('en') : '') + fact('أُضيف في', n.createdAt ? new Date(n.createdAt).toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }) : '');
    const steps = HOW[howKey(n)] || [];
    const isNew = n.createdAt && (Date.now() - Date.parse(n.createdAt) < 6048e5);

      if(typeof loadModsFromSupabase==='function')loadModsFromSupabase();

    finally{b.disabled=false}
  });
  $('admLogout').addEventListener('click',async function(){
    var c=client();if(c){try{await c.auth.signOut()}catch(e){}}

  });
})();
</script>
