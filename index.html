.zd{position:fixed;z-index:700;pointer-events:none;background:linear-gradient(135deg,#d8ffff,#55ffff 45%,#1bb3c9);box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),0 0 14px #55ffff}
.zghost{position:fixed;z-index:5000;pointer-events:none;object-fit:contain;background:var(--zk-night-deep);border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 24px color-mix(in srgb,var(--accent,var(--zk-cyan)) 40%,transparent)}
#modList{grid-auto-flow:dense}
.mod-card:not(.k-ver){grid-column:span 2;flex-direction:row}
.mod-card:not(.k-ver) .mod-thumb{flex:0 0 46%;aspect-ratio:auto;min-height:200px;border-radius:0;border-start-start-radius:6px;border-end-start-radius:6px}
.mod-card:not(.k-ver) .mod-thumb img{position:absolute;inset:0;width:100%;height:100%}
.mod-card:not(.k-ver) .mod-body{justify-content:center;gap:12px;padding:18px}
.mod-card:not(.k-ver) .mod-name{font-family:'Lalezar','Cairo',sans-serif;font-weight:400;font-size:clamp(19px,5.4vw,26px);line-height:1.25}
.mod-card:not(.k-ver) .dl-btn{font-size:15px;padding:12px}
@media(max-width:768px){
  .mod-card:not(.k-ver) .mod-thumb{min-height:170px}
  .mod-card:not(.k-ver) .mod-body{padding:12px;gap:9px}
}
.mod-card .mod-thumb{border-radius:6px 6px 0 0}
.mod-card, .dl-btn, .cchip, .hb{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sheet{box-shadow:0 0 0 2px var(--zk-black),inset 0 0 0 2px #3b1380,inset 0 0 0 4px #150533,0 -12px 60px color-mix(in srgb,var(--accent,var(--zk-cyan)) 28%,transparent)}
.sheet .d-title{text-shadow:0 0 18px color-mix(in srgb,var(--cat-color,var(--zk-white)) 60%,transparent)}
.tt-img{position:relative;border:2px solid var(--zk-black);border-radius:4px;background:#23222f;box-shadow:inset 3px 3px 0 #0c0b13,inset -3px -3px 0 #4b4a5e}
@keyframes zglint{from{background-position:130% 0}to{background-position:-130% 0}}
.zped{position:absolute;left:50%;bottom:7%;width:58%;height:11%;translate:-50% 0;border-radius:50%;pointer-events:none;opacity:.75;border:2px solid var(--cat-color);box-shadow:0 0 14px var(--cat-color),inset 0 0 10px color-mix(in srgb,var(--cat-color) 50%,transparent)}
@media(prefers-reduced-motion:no-preference){
  .k-skin.vis .mod-thumb img{transform-origin:50% 88%;animation:zturn 7s ease-in-out infinite}
  .k-skin.vis .zped{animation:zpd 2.6s ease-in-out infinite}
  @keyframes zturn{0%,100%{transform:perspective(520px) rotateY(-24deg)}50%{transform:perspective(520px) rotateY(24deg)}}
  @keyframes zpd{50%{transform:scale(1.12);opacity:.3}}
}

<script>
  /* Core ZORK Logic - Kept exactly intact to preserve database, search, and core functionality */
  /* ===== أضف عناصرك هنا ===== */
  const LOCAL_MODS = [
    /* انسخ القالب ده وكرره لكل عنصر (حط فاصلة بين كل عنصر والتاني):
    {
      name: 'اسم العنصر',

      image: 'https://...صورة.jpg',   // اختياري

      featured: false                 // true = علامة "مميز"
    },
    */
  ];
  /* ========================== */
  let allMods = LOCAL_MODS.slice();
  const PAGE_SIZE = 24, SEARCH_DEBOUNCE_MS = 200, EAGER_CARDS = 4;
  let sb = window.zorkSupabase;
  const REPORT_URL = '';
  const PAGES = '';   /* بعد ما ترفع صفحات build-pages.mjs اكتب هنا '/m/' عشان روابط المشاركة تبقى صفحات ثابتة */   
  const DL_NOTE = 'سيتم تحويلك لصفحة التحميل بأمان';   
  const NO_LINK_MSG = 'الرابط غير متاح حاليًا';
  const CAT = {
    Addons:   { label: 'مودات',             c: 'var(--emerald)',  ink: '#000',  st: 'transparent',  icon: 'i-addons',   route: 'addons' },
    Versions: { label: 'إصدارات ماينكرافت', c: 'var(--diamond)',  ink: '#000',  st: 'transparent',  icon: 'i-versions', route: 'versions' },
    Skins:    { label: 'السكنات',           c: 'var(--gold)',     ink: '#000',  st: 'transparent',  icon: 'i-skins',    route: 'skins' },
    Shaders:  { label: 'الشادرات',          c: 'var(--amethyst)', ink: '#000', st: 'transparent', icon: 'i-shaders',  route: 'shaders' }

  const CAP_AR = { All: 'الكل', Addons: 'مودات', Versions: 'إصدارات', Skins: 'سكنات', Shaders: 'شادرات' };
  const TYPES = ['mcpack', 'mcaddon', 'mcworld', 'apk', 'other'];

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function safeUrl(u) { try { u = String(u == null ? '' : u).trim(); const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? u : ''; } catch (e) { return ''; } }
  const fold = s => String(s == null ? '' : s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  function h32(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function normalize(m) {
    if (m && m._n) return m._n;
    const src = (m && typeof m === 'object') ? m : {};
    const str = v => v == null ? '' : String(v).trim();
    const list = v => Array.isArray(v) ? v : [];
    const name = str(src.name) || 'بدون اسم', download = safeUrl(src.download);
    const dl = (src.downloads === '' || src.downloads == null || !isFinite(+src.downloads)) ? null : +src.downloads;
    const slug = name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    const n = {
      id: str(src.id) || (slug + '-' + h32(name + '|' + download)),
      name, category: str(src.category), image: safeUrl(src.image), download,
      description: str(src.description), mcVersion: str(src.mcVersion), size: str(src.size), downloads: dl,
      createdAt: isFinite(Date.parse(src.createdAt)) ? str(src.createdAt) : '',
      images: list(src.images).map(safeUrl).filter(Boolean), tags: list(src.tags).map(str).filter(Boolean),
      featured: src.featured === true || src.featured === 'true', type: TYPES.indexOf(src.type) > -1 ? src.type : '', slug: str(src.slug)
    };
    n.s = fold(n.name + ' ' + n.tags.join(' ') + ' ' + n.description);
    try { Object.defineProperty(src, '_n', { value: n, enumerable: false }); } catch (e) {}
    return n;
