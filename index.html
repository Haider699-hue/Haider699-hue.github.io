<!DOCTYPE html>
<html lang="ar" dir="rtl" class="bb-loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Baybars — متجر إضافات ماينكرافت بيدروك</title>
<meta name="description" content="تحميل مباشر لإضافات (مودات) وسكنات وشيدرات وإصدارات ماينكرافت بيدروك إيديشن، محدّثة باستمرار." />
<meta name="theme-color" content="#08070c" />
<meta property="og:type" content="website" /><meta property="og:locale" content="ar_AR" /><meta property="og:title" content="Baybars — متجر إضافات ماينكرافت بيدروك" /><meta property="og:description" content="تحميل مباشر لإضافات وسكنات وشيدرات وإصدارات ماينكرافت بيدروك." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Base variables strictly for fallback if JS fails, but completely overridden in V5 */
  :root {
    --void: #0e0905; --edge: #120c07; --panel: #281e15; --panel-2: #1d150d;
    --emerald: #5fd17a; --diamond: #6cc6d9; --gold: #f0c24a; --amethyst: #e5604f;
    --r-sm: 2px; --r-md: 3px; --pop: cubic-bezier(.34, 1.56, .64, 1);
  }

  html { scroll-behavior: smooth; }
  body { font-family: 'Cairo', sans-serif; line-height: 1.5; min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  
  /* Required Core Layout Classes (Kept for JS compatibility) */
  .cats::-webkit-scrollbar, .hotbar::-webkit-scrollbar, .gal::-webkit-scrollbar { display: none; }
  .empty-state, .more-wrap { display: flex; justify-content: center; align-items: center; flex-direction: column; }
  .empty-state[hidden], .more-wrap[hidden], .sheet-overlay[hidden], .banner-logo:not([src]) { display: none !important; }
  
  /* SVG Symbols Hidden Container */
  svg[style*="position:absolute"] { display: none; }

  /* =====================================================================
     ZORK v5 — NEBULA RIFT (صدع السديم)
     Glassmorphism · Plasma Gradients · Enchanting Particles · Holographic Cards
     ===================================================================== */

  /* 1 ▸ Cosmic Palette */
  :root {
    --void: #030108;               /* Deepest space black */
    --edge: rgba(255, 255, 255, 0.1); 
    --glass-bg: rgba(12, 6, 26, 0.55); /* Frosted dark purple glass */
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    
    --ink: #f0f4ff; 
    --ink-dim: #a0a5c0; 
    --ink-faint: #5a5d7a;
    
    /* Neon Minecraft Colors */
    --emerald: #00ffaa;  --emerald-glow: rgba(0, 255, 170, 0.5);
    --diamond: #00e5ff;  --diamond-glow: rgba(0, 229, 255, 0.5);
    --gold:    #ffaa00;  --gold-glow: rgba(255, 170, 0, 0.5);
    --amethyst:#d900ff;  --amethyst-glow: rgba(217, 0, 255, 0.5);
    
    --r-sm: 12px; --r-md: 24px; --r-pill: 50px;
    --shadow-neon: 0 0 20px rgba(0, 229, 255, 0.2);
    --blur: blur(16px);
  }

  ::selection { background: var(--diamond); color: #000; }
  :focus-visible { outline: 2px solid var(--diamond); outline-offset: 3px; }

  /* 2 ▸ The Void Background */
  body {
    background: var(--void);
    color: var(--ink);
  }
  
  /* Ambient glowing orbs behind everything (CSS based, besides Canvas) */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background: 
      radial-gradient(circle at 15% 20%, rgba(217, 0, 255, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 85% 60%, rgba(0, 229, 255, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(0, 255, 170, 0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  /* 3 ▸ Floating Glass Header */
  header {
    position: sticky; top: 12px; z-index: 100;
    width: calc(100% - 24px); max-width: 1400px;
    margin: 0 auto;
    background: var(--glass-bg);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: var(--r-pill);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
    transition: transform 0.3s ease;
  }
  
  .header-inner { padding: 10px 20px; display: flex; align-items: center; gap: 15px; }
  
  .brand-mark {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--diamond);
    box-shadow: 0 0 15px var(--diamond-glow);
    object-fit: cover;
  }
  
  .brand-text {
    font-size: 22px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, #fff, #a0a5c0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }
  
  .ver-chip {
    background: rgba(0, 229, 255, 0.1); border: 1px solid var(--diamond);
    color: var(--diamond); border-radius: 20px; padding: 2px 10px;
    font-family: 'Silkscreen', monospace; font-size: 11px;
    box-shadow: 0 0 10px var(--diamond-glow);
  }


  .hdr-btn {
    background: transparent; border: none; color: var(--ink-dim);
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s;
  }
  .hdr-btn:hover { color: var(--diamond); background: rgba(0, 229, 255, 0.1); }
  #muteBtn { margin-inline-start: auto; }

  /* Animated neon strip at bottom of header */
  .ore-strip {
    position: absolute; bottom: -1px; left: 5%; width: 90%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--diamond), var(--amethyst), var(--emerald), transparent);
    background-size: 200% 100%;
    animation: neon-flow 4s linear infinite; opacity: 0.8;
  }
  @keyframes neon-flow { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  /* 4 ▸ The Main Panel (Container) */
  .panel {
    max-width: 1400px; margin: 20px auto 40px;
    background: transparent; border: none; box-shadow: none;
    position: relative; z-index: 10;
  }

  /* 5 ▸ Hero Section (Cosmic Rift) */
  .hero {
    position: relative; padding: 60px 20px 40px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  
  /* Glowing Portal behind logo */
  .hero::before {
    content: ""; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(217,0,255,0.15) 0%, rgba(0,229,255,0.05) 50%, transparent 70%);
    filter: blur(20px); z-index: -1;
    animation: pulse-portal 6s ease-in-out infinite alternate;
  }
  @keyframes pulse-portal { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }

  .hero-logo { width: min(320px, 80vw); position: relative; z-index: 2; filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.4)); }
  .hero-logo .fc rect { fill: #fff; }
  .hero-logo .fc rect.a { fill: #e0f7fa; }
  .hero-logo .fc rect.z { fill: var(--diamond); }
  .hero-logo .sh rect { fill: rgba(0,0,0,0.5); }

  .hero-tag {
    font-size: 18px; font-weight: 700; color: var(--diamond);
    letter-spacing: 1px; margin: 20px 0; text-shadow: 0 0 15px var(--diamond-glow);
  }

  .hero-blocks {
    display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 15px;
    width: 100%; max-width: 600px; position: relative; z-index: 2;
  }
  
  .hb {
    flex: 1 1 calc(25% - 15px); min-width: 90px; min-height: 80px;
    background: var(--glass-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); border-top: 2px solid var(--bc);
    border-radius: var(--r-md); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font-weight: 800; font-size: 14px; cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .hb .pix { width: 30px; height: 30px; color: var(--bc); filter: drop-shadow(0 0 10px var(--bc)); }
  .hb:hover {
    transform: translateY(-8px) scale(1.05);
    background: rgba(20, 10, 40, 0.8);
    border-color: var(--bc);
    box-shadow: 0 15px 25px rgba(0,0,0,0.4), 0 0 20px color-mix(in srgb, var(--bc) 30%, transparent);
  }

  .ground { display: none; } /* Removed old vanilla dirt */
  .sky, .moon, .cl, .hero-gate, .sonar-ring { display: none !important; }

  /* 6 ▸ Search Bar (Glowing Input) */
  .search-zone { padding: 20px; margin-top: 10px; }
  .search-box {
    max-width: 600px; margin: 0 auto; position: relative;
    background: var(--glass-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); border-radius: var(--r-pill);
    padding: 5px; display: flex; align-items: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }
  .search-box svg { width: 20px; height: 20px; color: var(--ink-dim); margin-inline-start: 15px; }
  #searchInput {
    flex: 1; background: transparent; border: none; color: var(--ink);
    padding: 12px 15px; font-size: 16px; font-family: 'Cairo', sans-serif;
  }
  #searchInput:focus { outline: none; }
  #searchInput::placeholder { color: var(--ink-faint); }
  .search-box:focus-within {
    border-color: var(--diamond);
    box-shadow: 0 0 25px var(--diamond-glow), inset 0 0 10px rgba(0, 229, 255, 0.1);
    transform: scale(1.02);
  }
  .result-count { text-align: center; margin-top: 10px; color: var(--ink-dim); font-size: 13px; min-height: 20px;}

  /* 7 ▸ Category Chips (Holographic Pills) */
  .cats.chipbar {
    position: sticky; top: 80px; z-index: 90;
    padding: 15px 20px; margin-bottom: 20px;
    background: linear-gradient(to bottom, rgba(3,1,8,0.9) 0%, transparent 100%);
  }
  .cchips { display: flex; justify-content: center; gap: 12px; overflow-x: auto; padding-bottom: 5px; }
  
  .cchip {
    background: var(--glass-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); border-radius: var(--r-pill);
    padding: 8px 20px; display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-dim); font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: all 0.3s ease; position: relative; overflow: hidden;
  }
  .cchip .pix { width: 20px; height: 20px; }
  
  /* Setting colors per category */
  .cchip[data-cat="All"] { --cc: #fff; }
  .cchip[data-cat="Addons"] { --cc: var(--emerald); }
  .cchip[data-cat="Versions"] { --cc: var(--diamond); }
  .cchip[data-cat="Skins"] { --cc: var(--gold); }
  .cchip[data-cat="Shaders"] { --cc: var(--amethyst); }
  
  .cchip:hover { border-color: var(--cc); color: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px color-mix(in srgb, var(--cc) 20%, transparent); }
  
  .cchip.active {
    background: var(--cc); color: #000; border-color: var(--cc);
    box-shadow: 0 0 20px color-mix(in srgb, var(--cc) 60%, transparent);
  }
  .cchip.active .pix { color: #000; }

  /* 8 ▸ Glass Cards Grid */
  .main { padding: 0 20px 40px; max-width: 1400px; margin: 0 auto; }
  #modList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }

  /* Holographic Card Base */
  .mod-card {
    position: relative;
    background: linear-gradient(145deg, rgba(25, 15, 45, 0.6), rgba(10, 5, 20, 0.4));
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-left: 1px solid var(--glass-highlight);
    border-radius: var(--r-md);
    padding: 0; display: flex; flex-direction: column;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-style: preserve-3d;
    overflow: visible; /* For glowing shadow to escape */
  }
  
  /* Outer glow pseudo-element */
  .mod-card::before {
    content: ""; position: absolute; inset: -2px; border-radius: var(--r-md);
    background: var(--cat-color, var(--diamond));
    z-index: -1; opacity: 0; filter: blur(15px);
    transition: opacity 0.4s ease;
  }

  .mod-card:hover {
    transform: translateY(-10px) scale(1.02) perspective(1000px) rotateX(2deg);
    border-color: color-mix(in srgb, var(--cat-color) 50%, rgba(255,255,255,0.2));
  }
  .mod-card:hover::before { opacity: 0.4; }

  /* Card Image */
  .mod-thumb {
    width: 100%; aspect-ratio: 16/9; position: relative;
    border-radius: var(--r-md) var(--r-md) 0 0; overflow: hidden;
    background: rgba(0,0,0,0.5);
  }
  .mod-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
  .mod-card:hover .mod-thumb img { transform: scale(1.1); }
  
  /* Skins square ratio override */
  .k-skin .mod-thumb { aspect-ratio: 1/1; }
  .k-skin .mod-thumb img { object-fit: contain; padding: 15px; }

  /* Category Badge Floating on Image */
  .mod-badge {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    border: 1px solid var(--cat-color); color: var(--cat-color);
    padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800;
    box-shadow: 0 0 10px color-mix(in srgb, var(--cat-color) 40%, transparent);
  }

  /* Card Content */
  .mod-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  
  .mod-name {
    font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.4;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  .mod-spec, .mod-meta { font-size: 12px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; }
  .mod-spec .dot { color: var(--ink-faint); }
  .mod-meta .num { color: #fff; font-family: monospace; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;}

  /* 9 ▸ Plasma Download Button */
  .dl-btn {
    margin-top: auto;
    background: linear-gradient(135deg, var(--cat-color), color-mix(in srgb, var(--cat-color) 50%, #000));
    color: #fff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    border: none; border-radius: 12px; padding: 12px;
    font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 15px color-mix(in srgb, var(--cat-color) 40%, transparent), inset 0 2px 0 rgba(255,255,255,0.3);
    transition: all 0.3s ease; position: relative; overflow: hidden;
  }
  
  /* Plasma shifting effect */
  .dl-btn::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: translateX(-100%); transition: 0.5s;
  }
  .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px color-mix(in srgb, var(--cat-color) 60%, transparent); filter: brightness(1.1); }
  .dl-btn:hover::before { transform: translateX(100%); }
  .dl-btn:active { transform: translateY(1px); }

  .dl-btn.is-off {
    background: rgba(255,255,255,0.05); color: var(--ink-faint) !important;
    box-shadow: none; border: 1px solid var(--glass-border);
  }
  .dl-btn.is-off::before { display: none; }

  /* Versions Card override */
  .k-ver { grid-column: 1 / -1; flex-direction: row; align-items: center; padding: 10px; }
  .k-ver .mod-body { flex-direction: row; align-items: center; justify-content: space-between; padding: 0 10px; }
  .k-ver .mod-name { font-size: 20px; color: var(--diamond); text-shadow: 0 0 10px var(--diamond-glow); flex: 1; }
  .k-ver .dl-btn { margin: 0; min-width: 120px; }
  @media (max-width: 768px) { .k-ver { flex-direction: column; align-items: stretch; } .k-ver .mod-body { flex-direction: column; align-items: stretch; gap: 10px; } }

  /* 10 ▸ Sheet / Modals (Glassmorphism) */
  .sheet-overlay { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .sheet {
    background: rgba(12, 6, 26, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); border-bottom: none;
    border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,255,255,0.1);
  }
  @media(min-width:760px) { .sheet { border-radius: 20px; border-bottom: 1px solid var(--glass-border); } }
  
  .sheet-bar { background: transparent; border-bottom: 1px solid var(--glass-border); padding: 15px; }
  .sheet-grip { background: rgba(255,255,255,0.2); border-radius: 4px; }
  .sheet-close {
    background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border);
    border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    transition: 0.3s;
  }
  .sheet-close:hover { background: #ff3366; box-shadow: 0 0 15px rgba(255,51,102,0.5); transform: rotate(90deg); }

  .d-title { font-size: 24px; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
  .d-desc { color: #d0d5f0; font-size: 15px; line-height: 1.8; }
  
  .d-dl {
    background: rgba(0,0,0,0.4); border-top: 1px solid var(--glass-border);
    backdrop-filter: blur(15px); padding: 15px 20px;
  }
  .d-dl .dl-big { height: 50px; font-size: 18px; border-radius: 16px; }

  .d-btn, .how, .rel {
    background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
    color: var(--ink); border-radius: 12px; transition: 0.3s;
  }
  .d-btn:hover, .how:hover, .rel:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
  .d-btn.warn { color: #ff3366; } .d-btn.warn:hover { background: rgba(255,51,102,0.1); border-color: #ff3366; }

  .modal {
    background: rgba(12, 6, 26, 0.95); backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }
  .modal h3 { background: transparent; border-bottom: 1px solid var(--glass-border); color: #fff; }
  .modal input, .modal select {
    background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: #fff; border-radius: 12px;
  }
  .modal input:focus, .modal select:focus { border-color: var(--diamond); box-shadow: 0 0 10px var(--diamond-glow); }
  .modal-submit { background: var(--diamond); color: #000; border: none; border-radius: 12px; box-shadow: 0 0 15px var(--diamond-glow); }

  /* Misc */
  .more-btn {
    background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;
    border-radius: var(--r-pill); padding: 12px 30px; backdrop-filter: blur(10px);
    transition: 0.3s;
  }
  .more-btn:hover { background: rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(255,255,255,0.1); transform: translateY(-3px); }
  
  #toTop { background: rgba(0,229,255,0.1); border: 1px solid var(--diamond); color: var(--diamond); border-radius: 50%; box-shadow: 0 0 15px var(--diamond-glow); }
  #toTop:hover { background: var(--diamond); color: #000; }
  
  footer { border-top: 1px solid var(--glass-border); background: transparent; color: var(--ink-faint); margin-top: 20px; }

  /* Badges */
  .zbadges { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; flex-direction: column; gap: 5px; }
  .zb {
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); border-radius: 6px;
    padding: 3px 10px; font-size: 11px; font-weight: 800; border: 1px solid var(--glass-border);
  }
  .zb-new { border-color: var(--emerald); color: var(--emerald); box-shadow: 0 0 10px var(--emerald-glow); }
  .zb-top { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
  .zb-top::before { content: "★"; margin-inline-end: 4px; }

  /* Skeletons */
  .skel-card { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: var(--r-md); }
  .skel-thumb, .skel-line, .skel-btn { background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.02) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px;}
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Mobile Adjustments */
  @media (max-width: 768px) {
    header { width: calc(100% - 16px); margin: 8px auto; border-radius: 20px; }
    .header-inner { padding: 8px 12px; }
    .brand-text { font-size: 18px; }
    .hero { padding: 40px 10px 20px; }
    .hero::before { width: 200px; height: 200px; }
    .hero-blocks { gap: 10px; }
    .hb { flex: 1 1 calc(50% - 10px); min-height: 60px; font-size: 13px; border-radius: 16px; }

<style id="baybars-s1">

<script>
  /* Core ZORK Logic - Kept exactly intact to preserve database, search, and core functionality */
  /* ===== أضف عناصرك هنا ===== */
  const LOCAL_MODS = [
    /* انسخ القالب ده وكرره لكل عنصر (حط فاصلة بين كل عنصر والتاني):
    {
      name: 'اسم العنصر',

      download: 'https://www.mediafire.com/...',
      image: 'https://...صورة.jpg',   // اختياري

      mcVersion: '1.21',              // اختياري
      size: '25 MB',                  // اختياري
      featured: false                 // true = علامة "مميز"
    },
    */
  ];
  /* ========================== */
  let allMods = LOCAL_MODS.slice();
  const PAGE_SIZE = 24, SEARCH_DEBOUNCE_MS = 200, EAGER_CARDS = 4;
  let sb = window.zorkSupabase;
  const REPORT_URL = '';   
  const DL_NOTE = 'سيتم تحويلك لصفحة التحميل بأمان';   
  const NO_LINK_MSG = 'الرابط غير متاح حاليًا';
  const CAT = {
    Addons:   { label: 'مودات',             c: 'var(--emerald)',  ink: '#000',  st: 'transparent',  icon: 'i-addons',   route: 'addons' },
    Versions: { label: 'إصدارات ماينكرافت', c: 'var(--diamond)',  ink: '#000',  st: 'transparent',  icon: 'i-versions', route: 'versions' },
    Skins:    { label: 'السكنات',           c: 'var(--gold)',     ink: '#000',  st: 'transparent',  icon: 'i-skins',    route: 'skins' },
    Shaders:  { label: 'الشادرات',          c: 'var(--amethyst)', ink: '#000', st: 'transparent', icon: 'i-shaders',  route: 'shaders' }
  };
  const ROUTE_CAT = { all: 'All', addons: 'Addons', versions: 'Versions', skins: 'Skins', shaders: 'Shaders' };
  const CAP_AR = { All: 'الكل', Addons: 'مودات', Versions: 'إصدارات', Skins: 'سكنات', Shaders: 'شادرات' };
  const TYPES = ['mcpack', 'mcaddon', 'mcworld', 'apk', 'other'];

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function safeUrl(u) { try { u = String(u == null ? '' : u).trim(); const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? u : ''; } catch (e) { return ''; } }
  const fold = s => String(s == null ? '' : s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  function h32(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function normalize(m) {
    if (m && m._n) return m._n;
    const src = (m && typeof m === 'object') ? m : {};
    const str = v => v == null ? '' : String(v).trim();
    const list = v => Array.isArray(v) ? v : [];
    const name = str(src.name) || 'بدون اسم', download = safeUrl(src.download);
    const dl = (src.downloads === '' || src.downloads == null || !isFinite(+src.downloads)) ? null : +src.downloads;
    const slug = name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    const n = {
      id: str(src.id) || (slug + '-' + h32(name + '|' + download)),
      name, category: str(src.category), image: safeUrl(src.image), download,
      description: str(src.description), mcVersion: str(src.mcVersion), size: str(src.size), downloads: dl,
      createdAt: isFinite(Date.parse(src.createdAt)) ? str(src.createdAt) : '',
      images: list(src.images).map(safeUrl).filter(Boolean), tags: list(src.tags).map(str).filter(Boolean),
      featured: src.featured === true || src.featured === 'true', type: TYPES.indexOf(src.type) > -1 ? src.type : ''
    };
    n.s = fold(n.name + ' ' + n.tags.join(' ') + ' ' + n.description);
    try { Object.defineProperty(src, '_n', { value: n, enumerable: false }); } catch (e) {}
    return n;
  }

  let detailOpen = false, curId = '', pushed = false, openerEl = null, view = [], shown = 0, curCat = 'All', curQ = '', curSort = '';
  const $id = id => document.getElementById(id);
  function filtered() {
    const q = fold(curQ).trim();
    return allMods.filter(m => { const n = normalize(m); return (curCat === 'All' || n.category === curCat) && (!q || n.s.indexOf(q) > -1); });
  }
  function apply() { renderMods(filtered()); }

  const KIND = { Addons: 'k-addon', Skins: 'k-skin', Shaders: 'k-shader', Versions: 'k-ver' };
  const chip = v => v ? `<span class="num">${esc(v)}</span>` : '';
  function cardHtml(m, i) {
    const n = normalize(m), c = CAT[n.category] || { label: n.category, c: '#fff', ink: '#000', st: 'transparent', icon: 'i-all' };
    const kind = KIND[n.category] || 'k-addon', sq = kind === 'k-skin';
    const thumb = n.image
      ? `<img src="${esc(n.image)}" alt="" width="${sq ? 320 : 320}" height="${sq ? 320 : 180}" decoding="async" loading="${i < EAGER_CARDS ? 'eager' : 'lazy'}">`
      : `<div class="ph" aria-hidden="true" style="--ph-c:${c.c}; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05);"><svg viewBox="0 0 16 16" style="width:40px;height:40px;color:${c.c};"><use href="#${c.icon}"/></svg></div>`;
    const btn = n.download
      ? `<a href="${esc(n.download)}" class="dl-btn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3v13m0 0l4-4m-4 4l-4-4M5 21h14"/></svg> تحميل</a>`
      : `<span class="dl-btn is-off" role="note">${NO_LINK_MSG}</span>`;
    const specs = [n.type && n.type !== 'other' ? '.' + n.type : '', n.size, kind === 'k-ver' ? '' : n.mcVersion].filter(Boolean);
    const chips = specs.map(v => `<span dir="ltr">${esc(v)}</span>`).join('<span class="dot" aria-hidden="true">·</span>');
    const name = `<div class="mod-name" role="button" tabindex="0">${esc(n.name)}</div>`;
    const wrap = chips ? `<div class="mod-spec">${chips}</div>` : '';
    const isNew = n.createdAt && (Date.now() - Date.parse(n.createdAt) < 6048e5),
      zb = (n.featured || isNew) ? '<div class="zbadges">' + (isNew ? '<span class="zb zb-new">جديد</span>' : '') + (n.featured ? '<span class="zb zb-top">مميز</span>' : '') + '</div>' : '';
    const head = `<div class="mod-card ${kind}${n.featured ? ' is-top' : ''}${isNew ? ' is-new' : ''}" data-id="${esc(n.id)}" data-cat="${esc(n.category)}" style="--cat-color:${c.c};">`;
    if (kind === 'k-ver') return `${head}<div class="mod-body">${name}${wrap}${btn}</div></div>`;
    return `${head}<div class="mod-thumb"><span class="mod-badge" style="color:${c.c}; border-color:${c.c};">${esc(c.label)}</span>${zb}${thumb}</div><div class="mod-body">${name}${wrap}${btn}</div></div>`;
  }

  function renderMods(mods) {
    if (mods === allMods) mods = filtered();
    view = mods || []; shown = 0;
    const seen = {};
    view.forEach(m => { const n = normalize(m); if (seen[n.id]) n.id += '-' + (++seen[n.id]); else seen[n.id] = 1; });
    $id('modList').innerHTML = '';
    showMore(false);
    $id('resultCount').textContent = view.length > 0 ? `تم العثور على ${view.length} عنصر في السديم` : '';
    $id('emptyState').hidden = view.length > 0;
    if (curId && !detailOpen) fromHash(true);
  }
  function showMore(focusNew) {
    const part = view.slice(shown, shown + PAGE_SIZE), first = shown;
    $id('modList').insertAdjacentHTML('beforeend', part.map((m, k) => cardHtml(m, first + k)).join(''));
    shown += part.length;
    const left = view.length - shown;
    $id('moreWrap').hidden = left <= 0;
    $id('moreBtn').textContent = left > 0 ? `المزيد من العناصر (${left})` : 'المزيد من العناصر';
  }
  $id('moreBtn').addEventListener('click', () => showMore(true));

  function parseHash() {
    const h = location.hash.replace(/^#\/?/, ''), qi = h.indexOf('?');
    const parts = (qi < 0 ? h : h.slice(0, qi)).split('/'), sp = new URLSearchParams(qi < 0 ? '' : h.slice(qi + 1));
    const r = { cat: 'All', q: sp.get('q') || '', sort: sp.get('sort') || '', id: '' };
    if (parts[0] === 'c' && ROUTE_CAT[parts[1]]) r.cat = ROUTE_CAT[parts[1]];
    else if (parts[0] === 'i' && parts[1]) { try { r.id = decodeURIComponent(parts[1]); } catch (e) {} }
    return r;
  }
  function buildHash() {
    if (curCat === 'All' && !curQ && !curSort) return '#/';
    const p = [curQ ? 'q=' + encodeURIComponent(curQ) : '', curSort ? 'sort=' + encodeURIComponent(curSort) : ''].filter(Boolean).join('&');
    return '#/c/' + (curCat === 'All' ? 'all' : CAT[curCat].route) + (p ? '?' + p : '');
  }
  function go(push) {
    try { const h = buildHash(); if (location.hash !== h && !(h === '#/' && !location.hash)) history[push ? 'pushState' : 'replaceState'](null, '', h); } catch (e) {}
  }
  function syncUi() {
    document.querySelectorAll('.cchip').forEach(p => {
      const on = p.dataset.cat === curCat; p.classList.toggle('active', on); p.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    const inp = $id('searchInput'); if (inp && inp.value !== curQ) inp.value = curQ;
  }
  function fromHash(force) {
    const r = parseHash();
    if (r.id) { curId = r.id; if (!openDetail(r.id, 'route') && allMods.length) { curId = ''; try { history.replaceState(null, '', '#/'); } catch (e) {} } return; }
    if (detailOpen) closeUi();
    curId = '';
    if (r.cat === curCat && r.q === curQ && r.sort === curSort) return;
    curCat = r.cat; curQ = r.q; curSort = r.sort; syncUi(); apply();
  }
  addEventListener('popstate', fromHash); addEventListener('hashchange', fromHash);

  window.filterMods = function(cat, el) { curCat = cat; syncUi(); apply(); go(true); };
  let searchTimer = 0;
  function searchMods() { clearTimeout(searchTimer); curQ = $id('searchInput').value; apply(); go(false); }
  $id('searchInput').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(searchMods, SEARCH_DEBOUNCE_MS); });

  const HOW = {
    mcpack:  ['افتح الملف باستخدام لعبة ماينكرافت.', 'انتظر رسالة تأكيد الاستيراد.', 'افتح إعدادات العالم وفعّل الحزمة.', 'العب!'],
    mcaddon: ['افتح الملف باستخدام اللعبة.', 'انتظر الاستيراد.', 'فعّل الحزم من إعدادات العالم.'],
    mcworld: ['افتح الملف باللعبة.', 'ستجد العالم مضافاً لقائمتك.'],
    skin:    ['اختر السكن من إعدادات الشخصية بعد فتحه.'],
    shader:  ['فعّل الحزمة من الموارد، قد تتطلب جهازاً قوياً.'],
    version: ['ثبت التطبيق ووافق على التثبيت الخارجي.']
  };
  const howKey = n => HOW[n.type] ? n.type : n.type === 'apk' ? 'version' : ({ Skins: 'skin', Shaders: 'shader', Versions: 'version' }[n.category] || 'mcpack');
  const sheet = $id('detail'), sheetBody = $id('detailBody');
  const shareUrl = id => { try { return location.href.split('#')[0] + '#/i/' + encodeURIComponent(id); } catch (e) { return ''; } };
  
  function detailHtml(n) {
    const c = CAT[n.category] || { label: n.category, c: '#fff' };
    const imgs = Array.from(new Set([n.image].concat(n.images).filter(Boolean)));
    const row = (k, v) => v ? `<div class="tt-row"><span>${k}</span><b dir="ltr">${esc(v)}</b></div>` : '';
    const steps = HOW[howKey(n)] || [];
    let h = `<div class="tt" style="--cat-color:${c.c}">`;
    if (imgs.length) h += `<div class="tt-img"><img src="${esc(imgs[0])}" alt="" decoding="async"></div>`;
    if (imgs.length > 1) h += '<div class="tt-th">' + imgs.map(u => `<img src="${esc(u)}" alt="" loading="lazy" onclick="this.closest('.tt').querySelector('.tt-img img').src=this.src">`).join('') + '</div>';
    h += `<h2 class="d-title" id="dTitle">${n.featured ? '★ ' : ''}${esc(n.name)}</h2><div class="tt-cat">${esc(c.label)}</div>`;
    h += row('النوع', n.type && n.type !== 'other' ? '.' + n.type : '') + row('الإصدار', n.mcVersion) + row('الحجم', n.size) + row('التحميلات', n.downloads != null ? n.downloads.toLocaleString('en') : '');
    if (n.tags.length) h += '<div class="tt-tags">' + n.tags.map(t => `<span>${esc(t)}</span>`).join('') + '</div>';
    if (n.description) h += `<p class="d-desc">${esc(n.description)}</p>`;
    if (steps.length) h += '<details class="tt-how"><summary>طريقة التثبيت</summary><ol>' + steps.map(t => `<li>${esc(t)}</li>`).join('') + '</ol></details>';
    h += '</div><div class="d-dl">';
    h += n.download
      ? `<a href="${esc(n.download)}" class="dl-btn dl-big" target="_blank" rel="noopener" style="--cat-color:${c.c}; width:100%;">تحميل</a>`
      : `<span class="dl-btn dl-big is-off" style="width:100%; justify-content:center;" role="note">${NO_LINK_MSG}</span>`;
    return h + '</div>';
  }

  function lock(on) {
    const r = document.documentElement;
    if (on) { r.classList.add('sheet-open'); } else { r.classList.remove('sheet-open'); }
  }
  
  function openDetail(id, mode, opener) {
    const m = allMods.find(x => normalize(x).id === id); if (!m) return false;
    const n = normalize(m);
    sheetBody.innerHTML = detailHtml(n); curId = id; sheet.parentElement.hidden = false; detailOpen = true;
    try { const h = '#/i/' + encodeURIComponent(id); history.pushState(null, '', h); pushed = true; } catch (e) {}
    lock(true);
    return true;
  }
  
  function closeUi() {
    detailOpen = false; sheet.parentElement.hidden = true; sheetBody.innerHTML = ''; lock(false);
    curId = '';
  }
  function closeDetail() {
    if (!detailOpen) return;
    if (pushed) { pushed = false; try { history.back(); return; } catch (e) {} }
    try { history.replaceState(null, '', buildHash()); } catch (e) {} closeUi();
  }
  
  $id('modList').addEventListener('click', e => {
    if (e.target.closest('.dl-btn')) return;
    const c = e.target.closest('.mod-card'); if (c) openDetail(c.dataset.id, 'push', c.querySelector('.mod-name'));
  });
  
  sheet.addEventListener('click', e => {
    const t = e.target;
    if (t === sheet.parentElement || t.closest('.sheet-close')) return closeDetail();
  });

  
  async function loadModsFromSupabase() {
    if (!sb) { console.warn('ZORK: Supabase JS failed to load.'); return; }
    try {
      const { data, error } = await sb.from('mods').select('id,name,category,image_url,download_url,description,mc_version,file_size,downloads,featured,created_at,published').eq('published', true).order('created_at', { ascending: false });
      if (error) throw error;
      allMods = LOCAL_MODS.concat((data || []).map(m => ({ id:m.id, name:m.name, category:m.category, image:m.image_url || '', download:m.download_url || '', description:m.description || '', mcVersion:m.mc_version || '', size:m.file_size || '', downloads:m.downloads ?? 0, featured:!!m.featured, createdAt:m.created_at || '' })));
      apply();
    } catch (e) { console.error('ZORK: failed to load mods from Supabase', e); }
  }
  

  ;async function zorkBoot() {
    sb = window.zorkSupabase;
    if (!sb) return;
    try {
      await loadModsFromSupabase();
    } catch (e) { console.error(e); }
  }
  if (window.zorkSupabase) zorkBoot(); else addEventListener('zork-sb-ready', zorkBoot, { once: true });

  $id('modList').addEventListener('click', async e => {
    const a = e.target.closest('a.dl-btn'); if (!a || !sb) return;
    const card = a.closest('.mod-card'), id = card && card.dataset.id;
    if (!id) return;
    try { await sb.rpc('increment_mod_download', { mod_id:id }); } catch (err) {}
  });

  { const r = parseHash(); curCat = r.cat; curQ = r.q; curSort = r.sort; curId = r.id; syncUi(); }
  renderMods(allMods);
</script>

<script>
/* Baybars · مرحلة 1: الأفاتار + ميل اللوجو 3D */
(function(){
  var a=document.querySelector('.hero-avatar'),m=document.querySelector('.brand-mark');
  if(a&&m)a.src=m.src;
  var st=document.querySelector('.logo3d'),hero=document.querySelector('.hero');
  if(!st||!hero||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var tx=0,ty=0,cx=.3,cy=-.2,idle=true,vis=true,run=false;
  hero.addEventListener('pointermove',function(e){var r=hero.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2;idle=false});
  hero.addEventListener('pointerleave',function(){idle=true});
  function loop(now){
    if(!vis){run=false;return}
    var t=now/1000,gx=idle?Math.sin(t*.7)*.55:tx,gy=idle?Math.cos(t*.5)*.3:ty;
    cx+=(gx-cx)*.08;cy+=(gy-cy)*.08;
    st.style.setProperty('--ry',(cx*30)+'deg');st.style.setProperty('--rx',(-cy*20)+'deg');
    requestAnimationFrame(loop)
  }
  new IntersectionObserver(function(e){vis=e[0].isIntersecting;if(vis&&!run){run=true;requestAnimationFrame(loop)}}).observe(hero);
})();
</script>

    glyph:{vy:[-.4,-.12],sw:.15,al:.75},snow:{vy:[.3,.8],sw:.4,al:.85}};
  var GL=['ᔑ','ʖ','ᓵ','↸','ᒷ','⎓','⊣','⍑','╎','⋮','ꖌ','ꖎ','ᒲ','リ','ᑑ','∷','ᓭ','ℸ','⚍','⍊','∴','⨅'];
  var root=document.documentElement,bar=document.querySelector('.cchips'),cur='',px=innerWidth/2,py=innerHeight/2;
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('pointerdown',function(e){px=e.clientX;py=e.clientY},{passive:true,capture:true});

  /* جسيمات */
  var cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1';
  document.body.appendChild(cv);
  var ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,1.5),W,H,N=(navigator.hardwareConcurrency||4)<=4?26:44,ps=[],sp=[],bt=B.mote,last=0,on=false;
  function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  rs();addEventListener('resize',rs);
  function mk(w,h,f){var e=document.createElement('canvas');e.width=w*dpr;e.height=h*dpr;var c=e.getContext('2d');c.scale(dpr,dpr);f(c);return{e:e,w:w,h:h}}
  function sprites(d){var o=[],c0=d.c[0],c1=d.c[1],i;
    if(d.t=='orb')[10,14,18].forEach(function(s){o.push(mk(s,s,function(c){var g=c.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
      g.addColorStop(0,'#f6ffc8');g.addColorStop(.45,c1);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,s,s)}))});
    else if(d.t=='glyph')for(i=0;i<10;i++)o.push(mk(16,16,function(c){c.font='14px sans-serif';c.fillStyle=i%2?c0:c1;c.fillText(GL[(Math.random()*GL.length)|0],1,13)}));
    else{var cols=d.t=='ember'?['#ffc15e',c0,c1]:d.t=='snow'?['#fff',c1,'#fff']:[c0,c1,c0],sz=d.t=='ember'?[3,4,5]:[2,3,4];
      for(i=0;i<3;i++)(function(i){o.push(mk(sz[i],sz[i],function(c){c.fillStyle=cols[i];c.fillRect(0,0,sz[i],sz[i])}))})(i)}
    return o}
  function spawn(p,init){var b=bt,dn=b.vy[0]>0;p.x=Math.random()*W;p.y=init?Math.random()*H:(dn?-20:H+20);
    p.vy=b.vy[0]+Math.random()*(b.vy[1]-b.vy[0]);p.vx=(Math.random()-.5)*b.sw;p.ph=Math.random()*6.28;
    p.l=init?Math.random():0;p.dl=.002+Math.random()*.004;p.s=sp[(Math.random()*sp.length)|0]}
  function setP(d){bt=B[d.t];sp=sprites(d);ps=[];for(var i=0;i<N;i++){var p={};spawn(p,true);ps.push(p)}}
  function draw(ts){if(!on)return;var k=Math.min(ts-last,50)/16.7;last=ts;ctx.clearRect(0,0,W,H);var t=ts/1000;
    for(var i=0;i<ps.length;i++){var p=ps[i];p.l+=p.dl*k;p.y+=p.vy*k;p.x+=(p.vx+Math.sin(t+p.ph)*.15)*k;
      if(p.l>=1||p.y<-30||p.y>H+30)spawn(p,false);
      ctx.globalAlpha=bt.al*(bt.life?1-p.l:bt.pulse?.65+.35*Math.sin(t*3+p.ph):Math.sin(Math.PI*p.l));
      ctx.drawImage(p.s.e,p.x,p.y,p.s.w,p.s.h)}

  function start(){if(rm||on)return;on=true;last=performance.now();requestAnimationFrame(draw)}

  /* بوابة + إشعار البُعد */
    function portal(d){var r=document.createElement('div');r.className='bb-ring';r.style.cssText='left:'+px+'px;top:'+py+'px;--c:'+d.c[0];
    document.body.appendChild(r);var big=Math.max(innerWidth,innerHeight)*2.4/100;
    r.animate([{transform:'translate(-50%,-50%) scale(.05)',opacity:.95},{transform:'translate(-50%,-50%) scale('+big+')',opacity:0}],
      {duration:900,easing:'cubic-bezier(.3,.6,.2,1)'}).onfinish=function(){r.remove()};
  }

  /* خانة الهوت بار المنزلقة */
  var sel=document.createElement('span');sel.className='hb-sel';bar.appendChild(sel);
  function place(){var a=bar.querySelector('.cchip.active');if(!a||!a.offsetWidth)return;
    sel.style.width=a.offsetWidth+'px';sel.style.height=a.offsetHeight+'px';sel.style.transform='translate('+a.offsetLeft+'px,'+a.offsetTop+'px)'}

  function setDim(cat){if(cat===cur||!D[cat])return;var first=!cur;cur=cat;root.setAttribute('data-dim',cat);
    if(!rm)setP(D[cat]);place();if(!first&&!rm)portal(D[cat]);}
  function sync(){var a=bar.querySelector('.cchip.active');if(a)setDim(a.dataset.cat)}
  new MutationObserver(sync).observe(bar,{attributes:true,subtree:true,attributeFilter:['class']});
  addEventListener('resize',place);if(document.fonts)document.fonts.ready.then(place);
  sync();place();start();
})();
</script>

<script>
/* Baybars · مرحلة 3 */
(function(){
  var root=document.documentElement,L=document.getElementById('modList'),cur=null;
  function done(){root.classList.remove('bb-loading')}
  new MutationObserver(function(){if(L.children.length)done()}).observe(L,{childList:true});
  setTimeout(function(){done();if(!window.zorkSupabase){var t=document.querySelector('#emptyState .empty-title'),u=document.querySelector('#emptyState .empty-sub');
    if(t)t.textContent='تعذّر الاتصال بالمتجر';if(u)u.textContent='تأكد من الإنترنت ثم أعد تحميل الصفحة'}},7000);
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  function rst(c){['--rx','--ry','--mx','--my'].forEach(function(p){c.style.removeProperty(p)})}
  L.addEventListener('pointermove',function(e){
    var c=e.target.closest('.mod-card');if(cur&&cur!==c)rst(cur);
    if(!c||c.classList.contains('k-ver')){cur=null;return}cur=c;
    var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.style.setProperty('--ry',((x-.5)*12)+'deg');c.style.setProperty('--rx',((.5-y)*10)+'deg');
    c.style.setProperty('--mx',(x*100)+'%');c.style.setProperty('--my',(y*100)+'%')});
  L.addEventListener('pointerleave',function(){if(cur)rst(cur);cur=null});
})();
</script>

<script>
/* Baybars · مرحلة 4: صوت مولّد بالكود + كريبر + اختصارات */
(function(){
  var AC=null,master,NB=null,muted=false,rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{muted=localStorage.getItem('bb-mute')=='1'}catch(e){}
  function ctx(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination)}
    if(AC.state=='suspended')AC.resume();return AC}
  function tone(type,f0,f1,dur,vol,delay){var c=ctx();if(!c||muted)return;var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
  function noise(dur,type,f0,f1,vol,a,q){var c=ctx();if(!c||muted)return;
    if(!NB){NB=c.createBuffer(1,c.sampleRate*2,c.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    var t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=NB;s.loop=true;f.type=type;f.Q.value=q||1;
    f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02)}
  var snd={
    click:function(){tone('square',620,420,.06,.1)},
    back:function(){tone('square',420,280,.07,.1)},
    whoosh:function(){noise(.75,'bandpass',250,2400,.5,.3,2);tone('sine',70,220,.6,.25)},
    xp:function(){var p=900+Math.random()*500;tone('sine',p,p*1.6,.11,.2);tone('sine',p*1.25,p*2,.11,.16,0);setTimeout(function(){tone('sine',p*1.5,p*2.4,.1,.14)},70)},
    hiss:function(){noise(1.1,'highpass',3500,6000,.4,.9,.5)},
    boom:function(){noise(.9,'lowpass',2600,110,.9,.05,.7);tone('sine',90,30,.7,.8)}
  };

  /* زرار الكتم */
  var mb=document.getElementById('muteBtn');
  function paint(){mb.classList.toggle('off',muted);mb.setAttribute('aria-pressed',muted?'true':'false');mb.setAttribute('aria-label',muted?'تشغيل الصوت':'كتم الصوت');
    var u=mb.querySelector('use'),id=muted?'i-spk-off':'i-spk-on';if(u&&document.getElementById(id))u.setAttribute('href','#'+id)}
  mb.addEventListener('click',function(){muted=!muted;try{localStorage.setItem('bb-mute',muted?'1':'0')}catch(e){}paint();if(!muted)snd.click()});
  paint();

  /* ربط الأصوات (window capture: بيشتغل حتى لو سكربت الإعلانات وقّف الحدث) */
  addEventListener('click',function(e){var t=e.target;if(!t.closest)return;
    if(t.closest('a.dl-btn'))return snd.xp();
    if(t.closest('.sheet-close'))return snd.back();
    if(t.closest('.cchip,.hb,.mod-card,.more-btn,.logo-stage'))snd.click()},true);
  new MutationObserver(function(){snd.whoosh()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-dim']});

  /* بيضة الكريبر: 5 ضغطات على اللوجو */
  var n=0,tm=0,busy=false,LS=document.querySelector('.logo-stage');
  LS.addEventListener('click',function(){n++;clearTimeout(tm);tm=setTimeout(function(){n=0},2200);if(n>=5&&!busy){n=0;creeper()}});
  function creeper(){busy=true;
    var F=['00000000','00000000','01100110','01100110','00011000','00111100','00111100','00100100'],G=['#3fa535','#4cc23f','#2f8a2a','#58d84a'],h='<svg viewBox="0 0 8 8" shape-rendering="crispEdges">';
    for(var y=0;y<8;y++)for(var x=0;x<8;x++)h+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+(F[y][x]=='1'?'#0b0b0b':G[(Math.random()*4)|0])+'"/>';
    var o=document.createElement('div');o.className='bb-cr';o.innerHTML=h+'</svg>';document.body.appendChild(o);snd.hiss();
    var sv=o.firstChild,bg=function(v,k){return{transform:'scale('+k+')',filter:'brightness('+v+')'}};
    var an=sv.animate([Object.assign(bg(1,.2),{offset:0}),Object.assign(bg(1,1),{offset:.2}),Object.assign(bg(2.4,1.15),{offset:.4}),Object.assign(bg(1,1.28),{offset:.6}),
      Object.assign(bg(2.4,1.4),{offset:.8}),Object.assign(bg(3,1.6),{offset:1})],{duration:1150,easing:'ease-in-out'});
    an.onfinish=function(){o.remove();boom()}}
  function boom(){snd.boom();
    var f=document.createElement('div');f.className='bb-flash';document.body.appendChild(f);
    f.animate([{opacity:1},{opacity:0}],{duration:750,easing:'ease-out'}).onfinish=function(){f.remove()};
    var cx=innerWidth/2,cy=innerHeight/2,C=['#3fa535','#4cc23f','#2f8a2a','#7a7a7a','#4a4a4a','#fff'];
    for(var i=0;i<36;i++){var d=document.createElement('div'),z=6+Math.random()*12,a=Math.random()*6.28,r=120+Math.random()*Math.max(innerWidth,innerHeight)*.5;
      d.className='bb-shard';d.style.cssText='left:'+cx+'px;top:'+cy+'px;width:'+z+'px;height:'+z+'px;background:'+C[(Math.random()*C.length)|0];document.body.appendChild(d);
      (function(d){d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+(Math.sin(a)*r+160)+'px) rotate('+(Math.random()*720-360)+'deg)',opacity:0}],
        {duration:900+Math.random()*500,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=function(){d.remove()}})(d)}
    var p=document.querySelector('.panel');
    if(p&&!rm)p.animate([{transform:'translate(0,0)'},{transform:'translate(-12px,7px)'},{transform:'translate(10px,-8px)'},{transform:'translate(-7px,-5px)'},{transform:'translate(5px,6px)'},{transform:'translate(0,0)'}],{duration:520});
    setTimeout(function(){busy=false},1500)}

  /* لمسات: أيقونة التبويب + اختصارات */
  var ic=document.createElement('link');ic.rel='icon';ic.href=document.querySelector('.brand-mark').src;document.head.appendChild(ic);
  addEventListener('keydown',function(e){
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();var i=document.getElementById('searchInput');i.focus();i.scrollIntoView({block:'center',behavior:'smooth'})}
    if(e.key==='Escape'){var c=document.querySelector('#detail:not([hidden]) .sheet-close');if(c)c.click()}});
})();
</script>
<script>
/* لوحة الإدارة: الدخول عن طريق  #admin  في آخر رابط الموقع */
(function(){
  /* اكتب إيميل حساب الأدمن هنا مرة واحدة (بين العلامتين) وساعتها هيطلب الباسورد بس */
  var ADMIN_EMAIL='kira757686868@gmail.com';
  var $=function(i){return document.getElementById(i)};
  if(ADMIN_EMAIL)$('admEmailWrap').hidden=true;
  var ov=$('adminModal'),msg=$('admMsg'),logged=false;
  function say(t,ok){msg.textContent=t||'';msg.className=ok?'ok':'err'}
  function client(){return window.zorkSupabase}
  function view(){$('admLogin').hidden=logged;$('admForm').hidden=!logged;$('admFab').hidden=!logged}
  function openM(){ov.hidden=false;say('');view()}
  function closeM(){ov.hidden=true}
  function init(){var c=client();if(!c)return;
    c.auth.getSession().then(function(r){logged=!!(r.data&&r.data.session);view()})}
  if(client())init();else addEventListener('zork-sb-ready',init,{once:true});
  function checkHash(){if(location.hash==='#admin'){openM();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}}
  addEventListener('hashchange',checkHash);checkHash();
  $('admFab').addEventListener('click',openM);
  $('admClose').addEventListener('click',closeM);
  ov.addEventListener('click',function(e){if(e.target===ov)closeM()});
  addEventListener('keydown',function(e){if(e.key==='Escape'&&!ov.hidden)closeM()});
  $('admLoginBtn').addEventListener('click',async function(){
    var c=client();if(!c){say('الاتصال لسه مجهزش، جرّب بعد لحظات');return}
    var e=ADMIN_EMAIL||$('admEmail').value.trim(),p=$('admPass').value;
    if(!e||!p){say(ADMIN_EMAIL?'اكتب كلمة المرور':'اكتب الإيميل وكلمة المرور');return}
    say('جاري الدخول...',1);
    try{var r=await c.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;
      logged=true;$('admPass').value='';view();say('تم الدخول ✓',1)}
    catch(x){var m=(x&&x.message)||'';
      say(/Invalid login/i.test(m)?'الباسورد غلط أو مفيش مستخدم بالإيميل ده في Supabase':/not confirmed/i.test(m)?'الإيميل لسه متفعّلش في Supabase':'فشل الدخول: '+m)}
  });
  $('admAddBtn').addEventListener('click',async function(){
    var c=client(),b=this;if(!c)return;
    var name=$('admName').value.trim(),cat=$('admCat').value,dl=$('admDl').value.trim(),img=$('admImg').value.trim();
    if(!name||!dl){say('اكتب الاسم ورابط التحميل');return}
    if(!/^https?:\/\//i.test(dl)||(img&&!/^https?:\/\//i.test(img))){say('الروابط لازم تبدأ بـ https://');return}
    b.disabled=true;say('جاري النشر...',1);
    try{var r=await c.from('mods').insert({name:name,category:cat,image_url:img||null,download_url:dl,published:true});
      if(r.error)throw r.error;
      $('admName').value='';$('admDl').value='';$('admImg').value='';
      say('تمت الإضافة ✓ وظهرت في القسم',1);
      if(typeof loadModsFromSupabase==='function')loadModsFromSupabase();
    }catch(x){say('فشل النشر: '+((x&&x.message)||'خطأ غير معروف'))}
    finally{b.disabled=false}
  });
  $('admLogout').addEventListener('click',async function(){
    var c=client();if(c){try{await c.auth.signOut()}catch(e){}}
    logged=false;view();closeM();
  });
})();
</script>
